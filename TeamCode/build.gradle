apply plugin: 'com.android.application'
import java.text.SimpleDateFormat

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

def getCommitCount = { ->
    return providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }.standardOutput.asText.get().trim().toInteger()
}
def getBranchName = { ->
    return providers.exec { commandLine 'git', 'symbolic-ref', '--short', 'HEAD' }.standardOutput.asText.get().trim()
}
def getShortGitCommitSha = { ->
    return providers.exec { commandLine 'git', 'rev-parse', '--short', 'HEAD' }.standardOutput.asText.get().trim()
}

android {
    namespace = 'org.firstinspires.ftc.teamcode'
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ["-language-version", "2.0", "-api-version", "2.0"]
    }
    packagingOptions { jniLibs.useLegacyPackaging true }
    buildFeatures.buildConfig true

    defaultConfig {
        versionName getBranchName() + "_" + getCommitCount() + "_" + getShortGitCommitSha()
        buildConfigField "String", "APP_BUILD_TIME", '"' + (new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ", Locale.ROOT).format(new Date())) + '"'
        buildConfigField "boolean", "IS_PRODUCTION", "false"
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
}

dependencies {
    implementation project(':FtcRobotController')
    implementation 'androidx.core:core-ktx:1.8.0'
    implementation 'com.pedropathing:tuning:1.0.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'
    androidTestImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'

    implementation("org.jetbrains.kotlin:kotlin-stdlib") { version { strictly("2.4.0") } }
    implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8") { version { strictly("2.4.0") } }
}