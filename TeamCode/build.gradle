apply plugin: 'com.android.application'

import java.text.SimpleDateFormat

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: 'org.jetbrains.kotlin.android'

def getCommitCount = { ->
    // FIXED: Uses the providers.exec service container block required for Gradle 9+
    return providers.exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
    }.standardOutput.asText.get().trim().toInteger()
}

def getBranchName = { ->
    // FIXED: Uses the providers.exec service container block required for Gradle 9+
    return providers.exec {
        commandLine 'git', 'symbolic-ref', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
}

def getShortGitCommitSha = { ->
    // FIXED: Uses the providers.exec service container block required for Gradle 9+
    return providers.exec {
        commandLine 'git', 'rev-parse', '--short', 'HEAD'
    }.standardOutput.asText.get().trim()
}


android {
    namespace = 'org.firstinspires.ftc.teamcode'
    kotlinOptions {
        jvmTarget = '1.8'
        freeCompilerArgs += ["-language-version", "1.9", "-api-version", "1.9"]
    }

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
    buildFeatures.buildConfig true

    defaultConfig {
        versionName getBranchName() + "_" + getCommitCount() + "_" + getShortGitCommitSha()
        buildConfigField "String", "APP_BUILD_TIME", '"' + (new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSSZ", Locale.ROOT).format(new Date())) + '"'
        // define whether this build is a production build
        buildConfigField "boolean", "IS_PRODUCTION", "false"
    }
}

